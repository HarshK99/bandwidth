<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bandwidth · Today proposal</title>
<style>
:root{color-scheme:light dark;--background:#fff;--foreground:#171717;--surface:#fafafa;--muted:#666670;--faint:#74747e;--line:#e4e4e7;--accent:#1f6f52;--hero-from:#1d6b4f;--hero-to:#2f8a7a;--focus:rgba(99,102,241,.055);--focus-edge:rgba(99,102,241,.30);--low:rgba(13,148,160,.06);--low-edge:rgba(13,148,160,.30);--rest:rgba(219,39,119,.045);--rest-edge:rgba(219,39,119,.24);--buffer:rgba(120,113,108,.055)}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font:14px/1.5 Manrope,ui-sans-serif,system-ui,sans-serif}button,select{font:inherit;color:inherit}button{cursor:pointer;background:transparent;border:0;min-height:44px;padding:8px 12px}button:hover:not(:disabled){background:var(--buffer)}button:disabled{color:var(--faint);cursor:default}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}button,select{border-radius:8px}.preview{padding:10px 20px;text-align:center;background:var(--surface);border-bottom:1px solid var(--line);color:var(--muted);font-size:12px}.shell{max-width:720px;padding:0 24px 110px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;padding:22px 0 12px}.brand{font-size:20px;font-weight:700;letter-spacing:-.04em}.quiet{color:var(--muted);font-size:12px}.subnav{display:flex;gap:24px;border-bottom:1px solid var(--line)}.subnav button{padding:8px 0;border-radius:0;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.subnav .selected{border-bottom:1px solid var(--accent)}.daybar{position:sticky;top:0;z-index:3;background:var(--background);padding:18px 0 16px;border-bottom:1px solid var(--line)}.barrow{display:flex;justify-content:space-between;align-items:center;gap:12px}.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}.weekday{color:var(--accent)}h1{font-size:16px;letter-spacing:-.015em;font-weight:500;margin:10px 0 4px}.clock{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.now-button{border:1px solid var(--line);border-radius:24px;padding:6px 16px;font-size:12px}.progress{height:3px;border-radius:4px;background:var(--line);margin-top:16px;overflow:hidden}.progress div{height:100%;background:var(--accent)}.timeline{list-style:none;padding:0;margin:32px 0 0}.row{display:grid;grid-template-columns:42px 16px minmax(0,1fr);position:relative}.ruler{position:relative;font-variant-numeric:tabular-nums;font-size:11px;color:var(--muted)}.tick{position:absolute;right:5px;transform:translateY(-50%)}.rail{position:relative;display:flex;justify-content:center}.rail:before{content:'';position:absolute;inset:0 auto;width:1px;background:var(--line)}.dot{position:absolute;top:0;width:7px;height:7px;border:1px solid var(--faint);border-radius:50%;background:var(--background);transform:translateY(-50%)}.past .dot{background:var(--faint)}.rail-fill{position:absolute;top:0;width:3px;background:var(--accent);border-radius:3px}.block{width:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;padding:16px 20px;border:1px solid var(--line);border-radius:0;background:var(--buffer);position:relative}.row:first-child .block{border-radius:16px 16px 0 0}.row:last-child .block{border-radius:0 0 16px 16px}.row+.row .block{border-top:0}.block.deep{background:var(--focus);border-color:var(--focus-edge)}.block.low{background:var(--low);border-color:var(--low-edge)}.block.recovery{background:var(--rest);border-color:var(--rest-edge)}button.block:hover{filter:brightness(.97);background:var(--surface)}.block .meta{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.block .lead{font-size:18px;font-weight:600;line-height:1.3;letter-spacing:-.02em;margin:7px 0}.block .caption{font-size:12px;color:var(--muted)}.block .arrow{position:absolute;right:18px;bottom:16px;color:var(--muted)}.past .block .lead{color:var(--muted)}.current .block{border-radius:16px!important;border:0;background:linear-gradient(125deg,var(--hero-from),var(--hero-to));color:#fff;z-index:1;box-shadow:0 10px 30px -12px #0005;padding:24px}.current .block .lead{font-size:28px;font-weight:750;margin:14px 0 8px}.current .block .meta,.current .block .caption,.current .block .arrow{color:#e1eee9}.current .ruler{color:var(--accent)}.current .block:hover{background:linear-gradient(125deg,var(--hero-from),var(--hero-to));filter:brightness(1.04)}.current .block .now-label{color:#fff}.remaining{font-variant-numeric:tabular-nums;text-transform:none;letter-spacing:0;font-weight:400}.timeline-end{padding:12px 0 0 58px;color:var(--muted);font-size:12px}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:5;border-top:1px solid var(--line);background:var(--background);padding-bottom:env(safe-area-inset-bottom)}.bottom-inner{display:flex;max-width:720px;margin:auto}.bottom-inner button{flex:1;min-height:60px;color:var(--muted);font-weight:500}.bottom-inner button[aria-pressed=true]{color:var(--foreground);font-weight:700}.coverage-head{padding:24px 0 12px}.coverage-head h1{font-size:26px;font-weight:650}.filters{display:flex;gap:14px;margin:20px 0}.filters label{flex:1;font-size:12px;color:var(--muted)}select{display:block;width:100%;min-height:44px;margin-top:6px;padding:8px;background:var(--surface);border:1px solid var(--line)}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{font-size:12px;border:1px solid var(--line)}.tree{margin-top:24px}details{border-top:1px solid var(--line)}summary{padding:14px 4px;min-height:44px;cursor:pointer;font-weight:600}summary small{display:inline-block;margin-left:8px;color:var(--muted);font-weight:400;font-size:11px}.stages{padding-left:18px}.tasks{margin:0;padding:0 0 16px 18px;list-style:none}.tasks li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;font-size:14px;border-bottom:1px solid var(--line)}.tasks small{font-size:11px;color:var(--muted);white-space:nowrap}.context{color:var(--muted);font-size:13px}.endnote{padding:24px 0;color:var(--muted);font-size:12px}.empty{padding:24px;background:var(--surface);border-radius:12px}.back{padding-left:0;color:var(--muted)}[hidden]{display:none!important}@media(prefers-color-scheme:dark){:root{--background:#0a0a0a;--foreground:#ededed;--surface:#141414;--muted:#a1a1aa;--faint:#92929b;--line:#303035;--accent:#6fb894;--focus:rgba(129,140,248,.10);--low:rgba(45,212,191,.085);--rest:rgba(244,114,182,.085);--buffer:rgba(168,162,158,.07)}}@media(max-width:480px){.shell{padding:0 16px 100px}.row{grid-template-columns:35px 12px minmax(0,1fr)}.block{padding:14px}.current .block{padding:20px}.current .block .lead{font-size:25px}.filters{flex-wrap:wrap}.filters label{min-width:130px}.tasks li{display:block}.tasks small{display:block;margin-top:4px}.preview{font-size:11px}.timeline-end{padding-left:47px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
/* Compact Coverage: one toolbar and one nested list, matching the app's density. */
.block.execution{background:rgba(13,148,160,.10);border-color:var(--low-edge)}
.current .block.execution{background:linear-gradient(125deg,var(--hero-from),var(--hero-to))}
.block .activity-guide{font-size:12px;line-height:1.5;color:var(--muted);max-width:100%;white-space:normal;overflow-wrap:break-word;text-wrap:pretty}
.current .block .activity-guide{color:#e1eee9}
.coverage-toolbar{display:flex;align-items:center;gap:8px;padding:12px 0;position:sticky;top:0;z-index:3;background:var(--background)}
.coverage-toolbar h1{margin:0 auto 0 0;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.coverage-toolbar .back{padding:8px;min-width:36px;font-size:18px}
.coverage-toolbar select{width:auto;max-width:155px;min-height:36px;margin:0;padding:6px 8px;font-size:12px;border-color:transparent;background:transparent}
.coverage-toolbar select:hover{border-color:var(--line)}
.tree{margin-top:0;padding:4px 8px;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.tree details{border:0}.tree summary{padding:7px 8px;min-height:34px;font-size:12px;font-weight:500;border-bottom:1px solid var(--line)}
.tree>details>summary{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:650;background:rgba(59,130,246,.035)}
.tree .stages{padding-left:14px}.tree .stages summary{background:rgba(217,119,6,.035)}
.tree .tasks{padding:0 0 0 20px;margin:0}.tree .tasks li{display:flex;align-items:baseline;gap:12px;padding:5px 8px;min-height:28px;font-size:12px;background:rgba(219,39,119,.022)}
.tree .tasks small{margin:0;font-size:10px;white-space:nowrap}.tree .tasks li span{flex:1;min-width:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:480px){.coverage-toolbar{gap:3px;flex-wrap:wrap}.coverage-toolbar select{max-width:140px;font-size:11px;padding:6px}.coverage-toolbar h1{font-size:10px}.tree .tasks li{display:flex}.tree .tasks small{display:inline;margin:0}.tree .stages{padding-left:10px}}
@media(pointer:coarse){.coverage-toolbar select,.coverage-toolbar .back,.tree summary{min-height:44px}}
</style>
</head>
<body>
<div class="preview">Today view proposal · Live India clock · Illustrative schedule, not your saved plan</div>
<div class="shell">
<div class="top"><span class="brand">bandwidth</span><span class="quiet">A place for what matters.</span></div>
<section id="today-view">
<nav class="subnav" aria-label="Direction views"><button class="selected" aria-current="page">Today</button><button disabled title="Not included in this Today-only preview">Week</button><button disabled title="Not included in this Today-only preview">Calendar</button></nav>
<div class="daybar"><div class="barrow"><span class="eyebrow"><span class="weekday" id="weekday"></span></span><button class="now-button" id="jump-now">Jump to now</button></div><div class="barrow"><h1 id="date"></h1><span class="clock" id="clock"></span></div><div class="progress" aria-hidden="true"><div id="day-progress"></div></div></div>
<ol class="timeline" id="timeline" aria-label="Today's timeline"></ol><div class="timeline-end">07:00 · Next morning</div>
</section>
<section id="coverage-view" hidden><div class="coverage-toolbar"><button class="back" id="back" aria-label="Back to Today" title="Back to Today">←</button><h1 id="coverage-title" tabindex="-1">Coverage</h1><select id="focus-filter" aria-label="Filter by area"></select><select id="effort-filter" aria-label="Filter by effort"><option value="all">All efforts</option><option value="deep">Deep work</option><option value="low">Light work</option><option value="execution">Production</option><option value="recovery">Recovery</option></select></div>
<p class="sr-only" id="filter-summary" role="status"></p><div class="tree" id="tree"></div></section>
</div>
<nav class="bottom-nav" aria-label="App sections"><div class="bottom-inner"><button id="nav-today" aria-pressed="true">Direction</button><button id="nav-coverage" aria-pressed="false">Coverage</button><button disabled title="Unchanged; outside this Today-only preview">Time</button><button disabled title="Unchanged; outside this Today-only preview">Upgrades</button></div></nav>
<script>
// Reusable activities, not exhaustive procedural steps. An activity may fit
// more than one effort without being stored as duplicate tasks.
const task=(name,...efforts)=>({name,efforts});
const areas = [
 {id:'wave',name:'Wave Link',children:[
  task('Customer discovery','deep'),
  task('Positioning','deep'),
  task('Lead research','low'),
  task('Outreach','deep','low'),
  task('Review usage and user feedback','deep','low'),
  task('Decide product changes','deep'),
  task('Product development','deep','execution')
 ]},
 {id:'freelance',name:'Freelance',children:[
  task('Market and customer discovery','deep'),
  task('Positioning and offer','deep'),
  task('Lead research','low'),
  task('Outreach','deep','low'),
  task('Sales','deep'),
  task('Scoping and proposals','deep'),
  task('Website production','deep','execution'),
  task('Invoice and follow up on payments','low'),
  task('Check in with clients and ask for referrals','deep','low')
 ]},
 {id:'content',name:'Content',children:[
  task('Content writing','deep'),
  task('Recording and editing','execution'),
  task('Publishing and engagement','low')
 ]},
 {id:'exploration',name:'Side projects',children:[
  task('Explore and test an idea','deep','execution')
 ]},
 {id:'jobs',name:'Jobs',children:[
  task('Find and apply for suitable roles','low'),
  task('Prepare for or attend interviews','deep')
 ]},
 {id:'recovery',name:'Recovery and life',children:[
  task('Exercise','recovery'),
  {name:'Hobbies',children:[task('Painting','recovery'),task('Crossword','recovery'),task('Language','recovery')]},
  {name:'Family and friends',children:[task('Call','recovery'),task('Meet','recovery')]},
  {name:'Life admin and finances',children:[task('Pay bills and review finances','low'),task('Run errands','low')]}
 ]}
];
const names={deep:'Deep work',low:'Light work',execution:'Production',recovery:'Recovery'};
const activityGuides={deep:'Think · Solve · Decide · Discuss',low:'Research · Post · Follow up · Admin',execution:'Build · Write · Edit · Refine'};

const $=id=>document.getElementById(id);
// Blocks describe effort only. The current bottleneck and business choice stay external.
const blocks=[
 {start:420,end:480,name:'Morning routine',type:'recovery'},
 {start:480,end:660,name:'Deep work',type:'deep'},
 {start:660,end:780,name:'Deep work',type:'deep'},
 {start:780,end:840,name:'Lunch',type:'buffer'},
 {start:840,end:930,name:'Light work',type:'low'},
 {start:930,end:1020,name:'Production',type:'execution'},
 {start:1020,end:1080,name:'Break',type:'buffer'},
 {start:1080,end:1170,name:'Deep work',type:'deep'},
 {start:1170,end:1260,name:'Dinner and downtime',type:'recovery'},
 {start:1260,end:1320,name:'Exercise',type:'recovery'},
 {start:1320,end:1440,name:'Wind-down',type:'recovery'},
 {start:1440,end:1860,name:'Sleep',type:'recovery'}
];
const timeLabel=n=>String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const timeOptions={timeZone:'Asia/Kolkata'};
let lastMinute='',lastTrigger=null,scrollPosition=0;
function updateClock(){
 const now=new Date();const parts=new Intl.DateTimeFormat('en-GB',{...timeOptions,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(now);const hour=Number(parts.find(p=>p.type==='hour').value),minute=Number(parts.find(p=>p.type==='minute').value);let minutes=hour*60+minute;if(minutes<420)minutes+=1440;
 const date=new Date(now);if(hour<7)date.setUTCDate(date.getUTCDate()-1);
 $('weekday').textContent=new Intl.DateTimeFormat('en-GB',{...timeOptions,weekday:'long'}).format(date);
 $('date').textContent=new Intl.DateTimeFormat('en-GB',{...timeOptions,day:'numeric',month:'long',year:'numeric'}).format(date);
 $('clock').textContent=new Intl.DateTimeFormat('en-GB',{...timeOptions,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(now)+' IST'+(hour<7?' · next morning':'');
 $('day-progress').style.width=((minutes-420)/1440*100)+'%';
 if(lastMinute!==String(minutes)){renderTimeline(minutes);lastMinute=String(minutes);}
}
function renderTimeline(now){
 const focusedId=document.activeElement?.id;
 $('timeline').replaceChildren();
 const current=blocks.findIndex(b=>now>=b.start&&now<b.end);
 blocks.forEach((b,i)=>{
  const live=i===current,past=b.end<=now;const row=document.createElement('li');row.className='row'+(live?' current':past?' past':'');row.id='row-'+i;
  const height=live?210:Math.round(Math.min(190,62+.62*(b.end-b.start)));
  const ruler=document.createElement('div');ruler.className='ruler';ruler.setAttribute('aria-hidden','true');
  const marks=[b.start];for(let n=Math.ceil((b.start+1)/60)*60;n<b.end;n+=60)marks.push(n);
  for(const n of marks){const tick=document.createElement('span');tick.className='tick';tick.textContent=timeLabel(n);tick.style.top=(n-b.start)/(b.end-b.start)*100+'%';ruler.append(tick);}
  const rail=document.createElement('div');rail.className='rail';rail.setAttribute('aria-hidden','true');const dot=document.createElement('span');dot.className=live?'rail-fill':'dot';if(live)dot.style.height=(now-b.start)/(b.end-b.start)*100+'%';rail.append(dot);
  const clickable=b.type!=='buffer';
  const card=document.createElement(clickable?'button':'div');card.className='block '+b.type;card.style.minHeight=height+'px';card.id='block-'+i;
  const meta=document.createElement('span');meta.className='meta';
  if(live){const label=document.createElement('span');label.className='now-label';label.textContent='Now';const remaining=document.createElement('span');remaining.className='remaining';const left=b.end-now;remaining.textContent=(Math.floor(left/60)?Math.floor(left/60)+'h ':'')+(left%60?left%60+'m ':'')+'left';meta.append(label,remaining);}
  else if(i===current+1){const next=document.createElement('span');next.textContent='Next';meta.append(next);}
  const lead=document.createElement('span');lead.className='lead';lead.textContent=b.name;
  if(meta.childElementCount)card.append(meta);
  card.append(lead);
  if(activityGuides[b.type]){const guide=document.createElement('span');guide.className='activity-guide';guide.textContent=activityGuides[b.type];card.append(guide);}
  if(clickable){card.setAttribute('aria-label',b.name+', '+timeLabel(b.start)+' to '+timeLabel(b.end)+'. Browse matching tasks across all areas');card.onclick=()=>openCoverage('all',b.type,card.id);}
  row.append(ruler,rail,card);$('timeline').append(row);
 });
 if(focusedId?.startsWith('block-'))$(focusedId)?.focus({preventScroll:true});
}
$('focus-filter').add(new Option('All areas','all'));for(const a of areas)$('focus-filter').add(new Option(a.name,a.id));
function matchingNodes(nodes,effort){
 return nodes.flatMap(node=>{
  if(node.children){const children=matchingNodes(node.children,effort);return children.length?[{...node,children}]:[];}
  return effort==='all'||node.efforts.includes(effort)?[node]:[];
 });
}
function appendNodes(container,nodes,effort,focus){
 let list=null;
 for(const node of nodes){
  if(node.children){
   list=null;
   const branch=document.createElement('details');branch.open=Boolean(node.id&&focus!=='all');
   const heading=document.createElement('summary');heading.textContent=node.name;branch.append(heading);
   const group=document.createElement('div');group.className='stages';appendNodes(group,node.children,effort,focus);
   branch.append(group);container.append(branch);
  }else{
   if(!list){list=document.createElement('ul');list.className='tasks';container.append(list);}
   const item=document.createElement('li'),label=document.createElement('span');label.textContent=node.name;item.append(label);
   if(effort==='all'){
    const tag=document.createElement('small');tag.textContent=node.efforts.map(type=>({deep:'Deep',low:'Light',execution:'Production',recovery:'Recovery'})[type]).join(' / ');
    tag.setAttribute('aria-label',node.efforts.map(type=>names[type]).join(' or '));item.append(tag);
   }
   list.append(item);
  }
 }
}
function renderTree(){
 const focus=$('focus-filter').value,effort=$('effort-filter').value,area=areas.find(a=>a.id===focus);
 $('filter-summary').textContent=(area?area.name:'All areas')+' · '+(names[effort]||'All efforts');$('tree').replaceChildren();
 appendNodes($('tree'),matchingNodes(areas.filter(a=>focus==='all'||a.id===focus),effort),effort,focus);
 if(!$('tree').children.length){const p=document.createElement('p');p.className='empty';p.textContent='No matching tasks. Widen the effort filter to browse this area.';$('tree').append(p);}
}
function openCoverage(focus,effort,trigger){scrollPosition=window.scrollY;lastTrigger=trigger;$('focus-filter').value=focus;$('effort-filter').value=effort;renderTree();$('today-view').hidden=true;$('coverage-view').hidden=false;$('nav-today').setAttribute('aria-pressed','false');$('nav-coverage').setAttribute('aria-pressed','true');window.scrollTo(0,0);$('coverage-title').focus({preventScroll:true});}
function back(){if(!$('today-view').hidden)return;$('today-view').hidden=false;$('coverage-view').hidden=true;$('nav-today').setAttribute('aria-pressed','true');$('nav-coverage').setAttribute('aria-pressed','false');window.scrollTo(0,scrollPosition);if(lastTrigger)$(lastTrigger)?.focus({preventScroll:true});}
$('back').onclick=back;$('nav-today').onclick=back;$('nav-coverage').onclick=()=>{if($('coverage-view').hidden)openCoverage('all','all',null);};
$('focus-filter').onchange=renderTree;$('effort-filter').onchange=renderTree;
$('jump-now').onclick=()=>{const row=document.querySelector('.row.current');if(row){const top=row.getBoundingClientRect().top+window.scrollY-document.querySelector('.daybar').offsetHeight-16;window.scrollTo({top,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}};
updateClock();setInterval(updateClock,1000);
</script>
</body>
</html>
